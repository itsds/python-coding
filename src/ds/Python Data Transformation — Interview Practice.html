<pre><code>Input:
customers = [
    {
        "name": "Alice",
        "transactions": [
            {"id": "T1", "amount": 150.0, "currency": "USD"},
            {"id": "T2", "amount": 89.50, "currency": "EUR"}
        ]
    },
    {
        "name": "Bob",
        "transactions": [
            {"id": "T3", "amount": 200.0, "currency": "USD"}
        ]
    }
]

Expected Output:
[
    {"customer": "Alice", "id": "T1", "amount": 150.0, "currency": "USD"},
    {"customer": "Alice", "id": "T2", "amount": 89.50, "currency": "EUR"},
    {"customer": "Bob",   "id": "T3", "amount": 200.0, "currency": "USD"}
]</code></pre>
<p><strong>Follow-up:</strong> What if some customers have no transactions key, or transactions is None?</p>`,

    result = []
    for customer in customers:
        name = customer["name"]
        for txn in customer.get("transactions") or []:
            result.append({
                "customer": name,
                **txn
            })
    return result

# One-liner version:
def flatten_transactions_v2(customers):
    return [
        {"customer": c["name"], **txn}
        for c in customers
        for txn in (c.get("transactions") or [])
    ]</code></pre>`,

    latest = {}
    for event in events:
        eid = event["event_id"]
        if eid not in latest or event["timestamp"] > latest[eid]["timestamp"]:
            latest[eid] = event
    return list(latest.values())

def dedup_from_file(filepath):

            eid = event["event_id"]

    return list(latest.values())</code></pre>`,

def summarize_sales(sales):
    region_totals = defaultdict(lambda: {"revenue": 0, "count": 0})
    product_revenue = defaultdict(lambda: defaultdict(int))

    for s in sales:

                         key=product_revenue[region].get)
        result[region] = {

            "num_transactions": totals["count"],
            "top_product": top_product
        }
    return result</code></pre>`,

    solution: `<pre><code>import csv
import io

def parse_and_clean(csv_data):
    valid, errors = [], []
    reader = csv.DictReader(io.StringIO(csv_data))

    for row_num, row in enumerate(reader, start=2):
        # Strip all values
        cleaned = {k: v.strip() for k, v in row.items()}

        # Skip fully empty rows
        if not any(cleaned.values()):
            continue

        # Validate required fields
        if not cleaned.get("name"):
            errors.append({"row": row_num, "reason": "missing name", "data": cleaned})
            continue
        if not cleaned.get("amount"):
            errors.append({"row": row_num, "reason": "missing amount", "data": cleaned})
            continue

        # Validate amount is numeric
        try:
            cleaned["amount"] = float(cleaned["amount"])
        except ValueError:
            errors.append({"row": row_num, "reason": "invalid amount", "data": cleaned})
            continue

        valid.append(cleaned)

    return valid, errors

# For a 10GB file: use the same pattern but read from file,
# process row by row (csv.DictReader already streams),
# and yield instead of appending:

def parse_large_file(filepath):

        for row in reader:

            if cleaned.get("name") and cleaned.get("amount"):

                    cleaned["amount"] = float(cleaned["amount"])
                    yield cleaned

    body: `<p>Compute a sliding window moving average over a stream of numbers. Given a list of values and a window size <code>k</code>, return the moving average at each position (starting from when the window is full).</p>
<pre><code>Input:
values = [10, 20, 30, 40, 50, 60, 70]
k = 3

Expected Output:
[20.0, 30.0, 40.0, 50.0, 60.0]
# Explanation:
# (10+20+30)/3=20, (20+30+40)/3=30, (30+40+50)/3=40, ...
</code></pre>
<p><strong>Follow-up:</strong> Implement as a generator that could process an infinite stream. What's the time complexity?</p>`,
    hint: `Maintain a running sum. When the window is full, subtract the element leaving and add the new one. Use <code>collections.deque(maxlen=k)</code> to automatically evict old elements.`,
    solution: `<pre><code>from collections import deque

def moving_average(values, k):
    result = []
    window = deque(maxlen=k)
    window_sum = 0

    for val in values:
        if len(window) == k:
            window_sum -= window[0]  # will be evicted
        window.append(val)
        window_sum += val
        if len(window) == k:
            result.append(window_sum / k)
    return result

# Generator version for infinite streams:
def moving_average_stream(stream, k):
    window = deque(maxlen=k)
    window_sum = 0
    for val in stream:
        if len(window) == k:
            window_sum -= window[0]
        window.append(val)
        window_sum += val
        if len(window) == k:
            yield window_sum / k</code></pre>`,
    walkthrough: `The running sum trick gives O(1) per element instead of O(k) — you don't re-sum the window each time. <code>deque(maxlen=k)</code> automatically drops the oldest element when full, but we subtract it from the sum before it's evicted. The generator version uses <code>yield</code> so it works on infinite streams with constant memory.`,

    hint: `Sort by start time first. Then iterate: if the current interval overlaps with the last merged interval (current start ≤ last end), extend the last merged interval. Otherwise, start a new merged interval.`,
    solution: `<pre><code>def merge_intervals(intervals):
    if not intervals:
        return []

    sorted_iv = sorted(intervals, key=lambda x: x[0])
    merged = [list(sorted_iv[0])]

    for start, end in sorted_iv[1:]:
        if start <= merged[-1][1]:
            merged[-1][1] = max(merged[-1][1], end)
        else:
            merged.append([start, end])

    return [tuple(iv) for iv in merged]

# Follow-up: ISO timestamps work the same way
# because they sort lexicographically:
def merge_time_intervals(intervals):
    if not intervals:
        return []
    sorted_iv = sorted(intervals, key=lambda x: x[0])
    merged = [list(sorted_iv[0])]
    for start, end in sorted_iv[1:]:
        if start <= merged[-1][1]:
            merged[-1][1] = max(merged[-1][1], end)
        else:
            merged.append([start, end])
    return [tuple(iv) for iv in merged]</code></pre>`,

    hint: `Use <code>re.match()</code> or simply <code>str.split()</code> — these logs are space-delimited so regex isn't strictly necessary, but knowing both approaches is valuable. Use <code>Counter</code> for both aggregations, and <code>.most_common(3)</code> for top paths.`,
    solution: `<pre><code>import re
from collections import Counter

def parse_logs(logs):
    pattern = r'(\\S+)\\s+(GET|POST|PUT|DELETE|PATCH)\\s+(\\S+)\\s+(\\d{3})'
    status_counts = Counter()
    path_counts = Counter()

    for line in logs:
        match = re.match(pattern, line)
        if match:
            timestamp, method, path, status = match.groups()
            status_counts[int(status)] += 1
            path_counts[path] += 1

    top_paths = path_counts.most_common(3)
    return dict(status_counts), top_paths

# Simpler version without regex (for well-structured logs):

        if len(parts) == 4:

            status_counts[int(status)] += 1
            path_counts[path] += 1

    title: "Build a Schema Validator",
    difficulty: "hard",
    skills: "type checking · recursion · error collection",
    body: `<p>Write a function that validates a list of records against a schema definition. The schema specifies field names, expected types, and whether fields are required. Collect all validation errors.</p>
<pre><code>schema = {
    "name":   {"type": str,   "required": True},
    "age":    {"type": int,   "required": True},
    "email":  {"type": str,   "required": False},
    "score":  {"type": float, "required": True},
}

records = [
    {"name": "Alice", "age": 30, "score": 95.5},
    {"name": "Bob",   "age": "twenty", "email": "bob@x.com", "score": 88.0},
    {"name": "",      "age": 25, "score": None},
]

Expected Output:
[
    {"row": 0, "errors": []},
    {"row": 1, "errors": ["age: expected int, got str"]},
    {"row": 2, "errors": ["name: empty value", "score: expected float, got NoneType"]}
]</code></pre>`,
    hint: `Iterate over records. For each record, iterate over schema fields. Check: is the field required and missing? Is it present but empty string? Is it present but wrong type? Collect errors per record.`,
    solution: `<pre><code>def validate_records(records, schema):
    results = []

    for idx, record in enumerate(records):
        errors = []
        for field, rules in schema.items():
            value = record.get(field)
            required = rules.get("required", False)
            expected_type = rules["type"]

            # Missing field
            if value is None and required:
                if field in record:
                    errors.append(
                        f"{field}: expected {expected_type.__name__}, got NoneType"
                    )
                else:
                    # field not present — ok if not required
                    if required:
                        errors.append(f"{field}: missing required field")
                continue

            # Empty string check (for required string fields)
            if value == "" and required:
                errors.append(f"{field}: empty value")
                continue

            # Skip type check if value is None and not required
            if value is None:
                continue

            # Type mismatch
            if not isinstance(value, expected_type):
                actual = type(value).__name__
                errors.append(
                    f"{field}: expected {expected_type.__name__}, got {actual}"
                )

        results.append({"row": idx, "errors": errors})

    return results</code></pre>`,

    skills: "generators · chaining transforms · functional style",
    body: `<p>Build a mini pipeline: read raw records → clean → validate → enrich → output. Each stage is a separate function. Chain them together cleanly using generators.</p>
<pre><code>Input:
raw_records = [
    '{"name": " Alice ", "amount": "150.50", "country": "US"}',
    '{"name": "Bob", "amount": "invalid", "country": "UK"}',
    '{"name": "", "amount": "200", "country": "IN"}',
    '{"name": "Charlie", "amount": "300.25", "country": "US"}',
]

Pipeline stages:
1. Parse: JSON string → dict
2. Clean: strip whitespace from name, convert amount to float
3. Validate: reject if name empty or amount not numeric
4. Enrich: add a "currency" field based on country (US→USD, UK→GBP, IN→INR)

Expected Output (valid records only):
[
    {"name": "Alice",   "amount": 150.5,  "country": "US", "currency": "USD"},
    {"name": "Charlie", "amount": 300.25, "country": "US", "currency": "USD"}
]</code></pre>`,
    hint: `Write each stage as a generator function that takes an iterable and yields transformed items. Chain them: <code>enrich(validate(clean(parse(raw_records))))</code>. Each generator processes one record at a time — no intermediate lists.`,
    solution: `<pre><code>import json

def parse(records):
    for raw in records:
        try:
            yield json.loads(raw)
        except json.JSONDecodeError:
            continue  # skip malformed JSON

def clean(records):
    for rec in records:
        rec["name"] = rec.get("name", "").strip()
        try:
            rec["amount"] = float(rec["amount"])
        except (ValueError, TypeError):
            rec["amount"] = None
        yield rec

def validate(records):
    for rec in records:
        if not rec["name"]:
            continue
        if rec["amount"] is None:
            continue
        yield rec

CURRENCY_MAP = {"US": "USD", "UK": "GBP", "IN": "INR", "EU": "EUR"}

def enrich(records):
    for rec in records:
        rec["currency"] = CURRENCY_MAP.get(rec.get("country"), "UNKNOWN")
        yield rec

# Chain them together:
def run_pipeline(raw_records):
    pipeline = enrich(validate(clean(parse(raw_records))))
    return list(pipeline)

# Usage:
result = run_pipeline(raw_records)</code></pre>`,
